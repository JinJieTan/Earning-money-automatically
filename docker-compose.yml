version: "3.9"

services:
  web:
    build: .
    container_name: agent-earner-web
    env_file:
      - .env
    ports:
      - "3000:3000"
    restart: unless-stopped
    volumes:
      - ./data:/app/data

  agent:
    build: .
    container_name: agent-earner-agent
    command: npm run agent
    env_file:
      - .env
    restart: unless-stopped
    volumes:
      - ./data:/app/data
